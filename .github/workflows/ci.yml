name: CI

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: RuboCop
        run: bundle exec rubocop -f github

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Brakeman
        run: bundle exec brakeman --no-pager

      - name: bundler-audit
        run: bundle exec bundler-audit check --update

  test:
    runs-on: ubuntu-24.04
    # Same Debian base and Chromium package as the production image, so the
    # PDF specs exercise the browser that ships (the runner's Google Chrome differs)
    container: ruby:4.0.8-slim

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: --health-cmd="pg_isready -U postgres" --health-interval=5s --health-timeout=5s --health-retries=10

    env:
      RAILS_ENV: test
      DATABASE_HOST: postgres
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      BUNDLE_PATH: vendor/bundle

    steps:
      - name: Install system packages
        run: |
          apt-get update -qq
          apt-get install --no-install-recommends -y build-essential git libpq-dev libyaml-dev pkg-config nodejs chromium fonts-dejavu-core

      - uses: actions/checkout@v5

      - uses: actions/cache@v4
        with:
          path: vendor/bundle
          key: gems-${{ hashFiles('.ruby-version', 'Gemfile.lock') }}

      - name: Install gems
        run: bundle install --jobs 4

      - name: Set up database
        run: bin/rails db:create db:schema:load

      - name: RSpec
        run: bundle exec rspec
